name: Validate promoted deal metadata

on:
  pull_request:
    paths:
      - 'content/deals/*.md'
      - 'scripts/validate_live_deal_metadata.py'
  workflow_dispatch:

jobs:
  validate-deal-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate new deals in this pull request
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          mapfile -t NEW_DEALS < <(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'content/deals/*.md' | awk '$1=="A"{print $2}')
          if [ "${#NEW_DEALS[@]}" -eq 0 ]; then
            echo "No newly added deal files detected."
            exit 0
          fi
          python scripts/validate_live_deal_metadata.py "${NEW_DEALS[@]}"
      - name: Explain manual invocation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "New live deal files are validated on pull requests and pushes."
