name: Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Guard against eval-like JavaScript
        run: |
          if rg -n "eval\\(|new Function\\(|setTimeout\\(\\s*['\\\"]|setInterval\\(\\s*['\\\"]" layouts static; then
            echo "Blocked: eval-like JavaScript patterns found. Refactor to safe alternatives."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce metadata for newly promoted deals
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid base SHA found for this push; skipping new-deal metadata guard."
            exit 0
          fi

          mapfile -t NEW_DEALS < <(git diff --name-status "$BEFORE" "$AFTER" -- 'content/deals/*.md' | awk '$1=="A"{print $2}')

          if [ "${#NEW_DEALS[@]}" -eq 0 ]; then
            echo "No newly added deal files detected."
            exit 0
          fi

          python scripts/validate_live_deal_metadata.py "${NEW_DEALS[@]}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build
        run: hugo --environment production

      - name: SEO audit
        env:
          SEO_AUDIT_STRICT: "0"
        run: |
          chmod +x scripts/seo_audit.sh
          ./scripts/seo_audit.sh public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
