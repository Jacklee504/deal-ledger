name: Scheduled Deal Ledger reel

on:
  schedule:
    # Tuesday and Friday at 14:00 UTC.
    - cron: "0 14 * * 2,5"
  workflow_dispatch:
    inputs:
      asins:
        description: "Optional: exactly three eligible, live US deal ASINs for a controlled render"
        required: false
        default: ""
        type: string
      upload_to_r2:
        description: "Explicitly upload the verified output to R2 (manual runs only)"
        required: true
        default: false
        type: boolean
      save_artifact:
        description: "Keep a three-day Media/videos artifact for download"
        required: true
        default: true
        type: boolean

concurrency:
  group: scheduled-deal-ledger-reel
  cancel-in-progress: false

jobs:
  render:
    name: Render and package current deal reel
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    defaults:
      run:
        working-directory: deal-reels

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deal-reels/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install render dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-render.txt

      - name: Lint renderer source
        run: |
          npm test
          npm run lint

      - name: Render eligible live US deals
        id: render
        env:
          REQUESTED_ASINS: ${{ inputs.asins }}
        run: |
          started_at="$(date +%s)"
          if [ -n "$REQUESTED_ASINS" ]; then
            npm run render:reel -- --asins "$REQUESTED_ASINS"
          else
            npm run render:reel
          fi
          archive_dir="$(find ../Media/videos/archive -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$archive_dir"
          archive_dir="$(cd "$archive_dir" && pwd)"
          echo "archive_dir=$archive_dir" >> "$GITHUB_OUTPUT"
          echo "render_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Verify rendered media
        id: verify
        env:
          ARCHIVE_DIR: ${{ steps.render.outputs.archive_dir }}
        run: |
          node scripts/verify-render-output.mjs "$ARCHIVE_DIR" --report "$RUNNER_TEMP/render-report.json"
          cat "$RUNNER_TEMP/render-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Package Media output for download
        id: package
        if: ${{ steps.render.outcome == 'success' && (github.event_name == 'schedule' || inputs.save_artifact) }}
        env:
          ARCHIVE_DIR: ${{ steps.render.outputs.archive_dir }}
        run: |
          package_dir="$RUNNER_TEMP/deal-ledger-reel-output"
          media_videos_dir="$(cd "$ARCHIVE_DIR/../.." && pwd)"
          mkdir -p "$package_dir/Media"
          cp -R "$media_videos_dir" "$package_dir/Media/videos"
          cp "$RUNNER_TEMP/render-report.json" "$package_dir/render-report.json"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Upload verified media to R2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_r2 }}
        env:
          ARCHIVE_DIR: ${{ steps.render.outputs.archive_dir }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: auto
        run: |
          test -n "$R2_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID secret."; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY secret."; exit 1; }
          test -n "$R2_ENDPOINT" || { echo "Missing R2_ENDPOINT secret."; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing R2_BUCKET repository variable."; exit 1; }
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          command -v aws >/dev/null || python -m pip install --disable-pip-version-check --no-cache-dir awscli
          prefix="social/scheduled-reels/${GITHUB_RUN_ID}"
          aws s3 sync "$ARCHIVE_DIR" "s3://${R2_BUCKET}/${prefix}" --endpoint-url "$R2_ENDPOINT" --no-progress
          for file in deal-ledger-reel.mp4 deal-ledger-reel-cover.png deal-ledger-reel-instagram-cover.png; do
            aws s3api head-object --bucket "$R2_BUCKET" --key "${prefix}/${file}" --endpoint-url "$R2_ENDPOINT" >/dev/null
          done
          if [ -n "$R2_PUBLIC_BASE_URL" ]; then
            base="${R2_PUBLIC_BASE_URL%/}/${prefix}"
            for file in deal-ledger-reel.mp4 deal-ledger-reel-cover.png deal-ledger-reel-instagram-cover.png; do
              curl --fail --silent --show-error --retry 3 --head "${base}/${file}" >/dev/null
            done
          fi
          echo "## R2 upload" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified R2 object prefix: \`${prefix}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Media/videos artifact
        if: ${{ always() && steps.render.outcome == 'success' && (github.event_name == 'schedule' || inputs.save_artifact) }}
        uses: actions/upload-artifact@v6
        with:
          name: deal-ledger-reel-${{ github.run_id }}
          path: ${{ steps.package.outputs.package_dir }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload generated cooldown history for scheduled persistence
        if: ${{ github.event_name == 'schedule' && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-deal-ledger-reel-history-${{ github.run_id }}
          path: deal-reels/data/reel-history.json
          if-no-files-found: error
          retention-days: 1

      - name: Report render duration
        if: ${{ always() }}
        run: |
          echo "## Scheduled reel result" >> "$GITHUB_STEP_SUMMARY"
          echo "Render seconds: ${{ steps.render.outputs.render_seconds || 'not available' }}" >> "$GITHUB_STEP_SUMMARY"

  persist-cooldown-history:
    name: Persist scheduled reel cooldown history
    needs: render
    if: ${{ github.event_name == 'schedule' && needs.render.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # This job alone needs write access, and commits only the cooldown file.
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download generated cooldown history
        uses: actions/download-artifact@v4
        with:
          name: scheduled-deal-ledger-reel-history-${{ github.run_id }}
          path: ${{ runner.temp }}/scheduled-reel-history

      - name: Commit only the generated cooldown history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          generated_history="$(find "$RUNNER_TEMP/scheduled-reel-history" -type f -name reel-history.json -print -quit)"
          test -n "$generated_history"
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            worktree="$RUNNER_TEMP/scheduled-reel-history-${attempt}"
            git worktree add --detach "$worktree" "origin/$DEFAULT_BRANCH"
            if (
              cd "$worktree"
              node deal-reels/scripts/reel-history.mjs --merge deal-reels/data/reel-history.json "$generated_history"
              git add -- deal-reels/data/reel-history.json
              if git diff --cached --quiet -- deal-reels/data/reel-history.json; then
                exit 10
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit --only deal-reels/data/reel-history.json -m "chore: record scheduled Deal Ledger reel"
              git push origin "HEAD:${DEFAULT_BRANCH}"
            ); then
              echo "Persisted merged deal-reels/data/reel-history.json to ${DEFAULT_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              status=$?
            fi
            if [ "$status" -eq 10 ]; then
              echo "Cooldown history was already current." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Cooldown history push attempt ${attempt} failed; retrying with the latest default branch." >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Could not persist cooldown history after three attempts." >&2
          exit 1
